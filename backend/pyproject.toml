[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "cubeai-lab"
version = "0.1.0"
description = "Framework-free CubeLab domain workspace."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.0,<0.17",
    "mypy>=2.3.1,<3",
    "import-linter>=2.14,<3",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
exclude = "(^|/)(\\.venv|build|dist)(/|$)"

[tool.importlinter]
root_package = "cubeai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CubeLab domain is framework-independent"
type = "forbidden"
source_modules = ["cubeai.lab.domain"]
forbidden_modules = [
    "cubeai.api",
    "cubeai.adapters",
    "fastapi",
    "sqlite3",
    "httpx",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cubeai"]
