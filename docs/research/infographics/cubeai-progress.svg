<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" style="font-family:Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>CubeAI feasibility foundation: Tasks 1–8 complete</title>
  <desc>An ordinal roadmap showing the completed Tasks 1–5 baseline and the newly completed Tasks 6–8, with evidence, outputs, and the boundary before Task 9.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#252B35" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" data-fill-role="canvas" fill="#F7F7F5"/>
  <line x1="92" y1="178" x2="220" y2="178" stroke-width="4" stroke-linecap="round" data-stroke-role="focus" stroke="#2E6DA4"/>
  <text x="92" y="82" font-size="14" font-weight="700" letter-spacing="2" data-fill-role="focus" fill="#2E6DA4">CUBEAI · FEASIBILITY FOUNDATION</text>
  <text x="92" y="126" font-size="42" font-weight="700" data-fill-role="ink" fill="#252B35">Eight steps turn a concept into an evidence-backed plan</text>
  <text x="92" y="158" font-size="17" data-fill-role="muted" fill="#636A75">Tasks 1–5 established the baseline; Tasks 6–8 closed the current research tranche. Order is ordinal, not time-scaled.</text>

  <rect x="64" y="198" width="910" height="48" rx="24" data-fill-role="edge-fill" data-stroke-role="edge-line" fill="#EAF0F6" stroke="#2E6DA4"/>
  <text x="88" y="228" font-size="18" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">COMPLETED BASELINE · TASKS 1–5</text>
  <rect x="998" y="198" width="538" height="48" rx="24" data-fill-role="compute-fill" data-stroke-role="compute-line" fill="#ECF4F1" stroke="#3F8F72"/>
  <text x="1022" y="228" font-size="18" font-weight="700" data-fill-role="compute-ink" fill="#234F3F">NEWLY COMPLETED · TASKS 6–8</text>

  <line x1="130" y1="346" x2="1470" y2="346" stroke-width="8" stroke-linecap="round" data-stroke-role="rule" stroke="#DEE0E2"/>
  <line x1="130" y1="346" x2="914" y2="346" stroke-width="8" stroke-linecap="round" data-stroke-role="edge-line" stroke="#2E6DA4"/>
  <line x1="914" y1="346" x2="1470" y2="346" stroke-width="8" stroke-linecap="round" data-stroke-role="compute-line" stroke="#3F8F72"/>

  <!-- task markers: filled baseline, ringed new tranche -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="130" cy="346" r="17" data-fill-role="focus" fill="#2E6DA4"/><text x="130" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">1</text>
    <circle cx="322" cy="346" r="17" data-fill-role="focus" fill="#2E6DA4"/><text x="322" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">2</text>
    <circle cx="514" cy="346" r="17" data-fill-role="focus" fill="#2E6DA4"/><text x="514" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">3</text>
    <circle cx="706" cy="346" r="17" data-fill-role="focus" fill="#2E6DA4"/><text x="706" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">4</text>
    <circle cx="898" cy="346" r="17" data-fill-role="focus" fill="#2E6DA4"/><text x="898" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">5</text>
    <circle cx="1090" cy="346" r="24" data-fill-role="canvas" data-stroke-role="compute-line" fill="#F7F7F5" stroke="#3F8F72" stroke-width="3"/><circle cx="1090" cy="346" r="17" data-fill-role="positive" fill="#3F8F72"/><text x="1090" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">6</text>
    <circle cx="1282" cy="346" r="24" data-fill-role="canvas" data-stroke-role="compute-line" fill="#F7F7F5" stroke="#3F8F72" stroke-width="3"/><circle cx="1282" cy="346" r="17" data-fill-role="positive" fill="#3F8F72"/><text x="1282" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">7</text>
    <circle cx="1470" cy="346" r="24" data-fill-role="canvas" data-stroke-role="compute-line" fill="#F7F7F5" stroke="#3F8F72" stroke-width="3"/><circle cx="1470" cy="346" r="17" data-fill-role="positive" fill="#3F8F72"/><text x="1470" y="351" font-size="14" data-fill-role="on-focus" fill="#FFFFFF">8</text>
  </g>

  <!-- alternating milestone cards -->
  <g filter="url(#shadow)">
    <rect x="64" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="edge-line" fill="#FFFFFF" stroke="#2E6DA4"/>
    <rect x="256" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="edge-line" fill="#FFFFFF" stroke="#2E6DA4"/>
    <rect x="448" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="edge-line" fill="#FFFFFF" stroke="#2E6DA4"/>
    <rect x="640" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="edge-line" fill="#FFFFFF" stroke="#2E6DA4"/>
    <rect x="832" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="edge-line" fill="#FFFFFF" stroke="#2E6DA4"/>
    <rect x="1024" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="compute-line" fill="#FFFFFF" stroke="#3F8F72" stroke-width="2"/>
    <rect x="1216" y="392" width="176" height="164" rx="14" data-fill-role="surface" data-stroke-role="compute-line" fill="#FFFFFF" stroke="#3F8F72" stroke-width="2"/>
    <rect x="1408" y="392" width="128" height="164" rx="14" data-fill-role="surface" data-stroke-role="compute-line" fill="#FFFFFF" stroke="#3F8F72" stroke-width="2"/>
  </g>
  <g data-fill-role="ink" fill="#252B35">
    <text x="82" y="424" font-size="18" font-weight="700">Repository</text><text x="82" y="449" font-size="14"><tspan x="82">Product, architecture,</tspan><tspan x="82" dy="22">roadmap, milestones</tspan><tspan x="82" dy="22">and initial backlog.</tspan></text>
    <text x="274" y="424" font-size="18" font-weight="700">Cube data</text><text x="274" y="449" font-size="14"><tspan x="274">Synthetic footprint</tspan><tspan x="274" dy="22">and identity-safe</tspan><tspan x="274" dy="22">domain boundaries.</tspan></text>
    <text x="466" y="424" font-size="18" font-weight="700">Draft engine</text><text x="466" y="449" font-size="14"><tspan x="466">Deterministic picks,</tspan><tspan x="466" dy="22">alternating packs,</tspan><tspan x="466" dy="22">retained seen state.</tspan></text>
    <text x="658" y="424" font-size="18" font-weight="700">Bot baseline</text><text x="658" y="449" font-size="14"><tspan x="658">Three transparent</tspan><tspan x="658" dy="22">heuristics; 10k runs</tspan><tspan x="658" dy="22">under 79 seconds.</tspan></text>
    <text x="850" y="424" font-size="17" font-weight="700">Analytics + scale</text><text x="850" y="449" font-size="14"><tspan x="850">Python / SQLite</tspan><tspan x="850" dy="22">comparison and</tspan><tspan x="850" dy="22">storage projections.</tspan></text>
    <text x="1042" y="424" font-size="18" font-weight="700">Toolchain</text><text x="1042" y="449" font-size="14"><tspan x="1042">Local-first backend</tspan><tspan x="1042" dy="22">and frontend choices</tspan><tspan x="1042" dy="22">evaluated for M1.</tspan></text>
    <text x="1234" y="424" font-size="18" font-weight="700">Providers</text><text x="1234" y="449" font-size="14"><tspan x="1234">CubeCobra import +</tspan><tspan x="1234" dy="22">Scryfall resolution;</tspan><tspan x="1234" dy="22">evidence bounded.</tspan></text>
    <text x="1426" y="424" font-size="18" font-weight="700">Bot path</text><text x="1426" y="449" font-size="14"><tspan x="1426">Safe inputs,</tspan><tspan x="1426" dy="22">evaluation, ML</tspan><tspan x="1426" dy="22">deferred.</tspan></text>
  </g>

  <rect x="64" y="600" width="1472" height="188" rx="18" data-fill-role="strip" data-stroke-role="rule" fill="#F7F9FB" stroke="#DEE0E2" data-layout-container="progress-support" data-min-pad="24" data-min-visual-pad="8" data-symmetry="x" data-symmetry-tol="1" data-layout-count="3"/>
  <text x="92" y="638" font-size="15" font-weight="700" letter-spacing="1.5" data-fill-role="muted" fill="#636A75">WHAT THE EIGHT STEPS SUPPORT</text>
  <g>
    <rect x="92" y="664" width="430" height="92" rx="12" data-fill-role="edge-fill" data-stroke-role="edge-line" fill="#EAF0F6" stroke="#2E6DA4" data-layout-parent="progress-support"/>
    <text x="116" y="695" font-size="19" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">Evidence-backed M1 direction</text><text x="116" y="722" font-size="15" data-fill-role="edge-ink" fill="#193C5A">Deterministic, local-first, provenance-preserving.</text>
    <rect x="548" y="664" width="430" height="92" rx="12" data-fill-role="compute-fill" data-stroke-role="compute-line" fill="#ECF4F1" stroke="#3F8F72" data-layout-parent="progress-support"/>
    <text x="572" y="695" font-size="19" font-weight="700" data-fill-role="compute-ink" fill="#234F3F">Complexity stays staged</text><text x="572" y="722" font-size="15" data-fill-role="compute-ink" fill="#234F3F">Transparent bots now; learned systems need new evidence.</text>
    <rect x="1004" y="664" width="504" height="92" rx="12" data-fill-role="external-fill" data-stroke-role="external-line" fill="#F9F9F9" stroke="#B9BCC1" data-layout-parent="progress-support"/>
    <text x="1028" y="695" font-size="19" font-weight="700" data-fill-role="ink" fill="#252B35">Boundary held</text><text x="1028" y="718" font-size="15" data-fill-role="muted" fill="#636A75"><tspan x="1028">Task 9 and production implementation are outside this tranche.</tspan><tspan x="1028" dy="20">No merge or push.</tspan></text>
  </g>
  <text x="64" y="842" font-size="13" data-fill-role="muted" fill="#636A75">STATUS KEY</text>
  <circle cx="164" cy="837" r="8" data-fill-role="focus" fill="#2E6DA4"/><text x="180" y="842" font-size="13" data-fill-role="muted" fill="#636A75">completed baseline</text>
  <circle cx="335" cy="837" r="11" data-fill-role="canvas" data-stroke-role="compute-line" fill="#F7F7F5" stroke="#3F8F72" stroke-width="2"/><circle cx="335" cy="837" r="6" data-fill-role="positive" fill="#3F8F72"/><text x="353" y="842" font-size="13" data-fill-role="muted" fill="#636A75">newly completed</text>
  <text x="1536" y="842" font-size="13" text-anchor="end" data-fill-role="muted" fill="#636A75">Evidence snapshot · Tasks 1–8</text>
</svg>
