  <text x="88" y="278" font-size="38" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">111.850</text><text x="88" y="305" font-size="16" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">standard drafts / second</text>
  <text x="88" y="338" font-size="14" data-fill-role="muted" fill="#636A75">8 seats × 3 packs × 15 cards</text><text x="88" y="361" font-size="14" data-fill-role="muted" fill="#636A75">mean 0.008940512 seconds / draft</text>
  <rect x="460" y="220" width="96" height="26" rx="13" data-fill-role="focus" fill="#2E6DA4"/><text x="508" y="238" text-anchor="middle" font-size="12" font-weight="700" data-fill-role="on-focus" fill="#FFFFFF">MEASURED</text>
  <text x="464" y="278" font-size="38" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">82,816 B</text><text x="464" y="305" font-size="16" font-weight="700" data-fill-role="edge-ink" fill="#193C5A">retained standard draft state</text>
  <text x="464" y="338" font-size="14" data-fill-role="muted" fill="#636A75">≈ 80.9 KiB · 360 pick events</text><text x="464" y="361" font-size="14" data-fill-role="muted" fill="#636A75">complete pre-pick pack views retained</text>
