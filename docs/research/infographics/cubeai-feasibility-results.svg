<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" style="font-family:Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>CubeAI feasibility results support a lean local-first baseline</title>
  <desc>A measured-evidence dashboard for Tasks 2–5: draft speed, retained state, bot throughput, analytics performance, and measured versus projected storage.</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#252B35" flood-opacity="0.10"/></filter></defs>
  <rect width="1600" height="900" data-fill-role="canvas" fill="#F7F7F5"/>
  <line x1="92" y1="178" x2="220" y2="178" stroke-width="4" stroke-linecap="round" data-stroke-role="focus" stroke="#2E6DA4"/>
  <text x="92" y="82" font-size="14" font-weight="700" letter-spacing="2" data-fill-role="focus" fill="#2E6DA4">CUBEAI · TASKS 2–5 · SYNTHETIC FEASIBILITY EVIDENCE</text>
  <text x="92" y="126" font-size="42" font-weight="700" data-fill-role="ink" fill="#252B35">The local-first baseline is fast enough; retained evidence drives scale</text>
  <text x="92" y="158" font-size="17" data-fill-role="muted" fill="#636A75">Measured values are machine-specific synthetic probes. Storage beyond 1,000 drafts is a linear projection, not a measurement.</text>

