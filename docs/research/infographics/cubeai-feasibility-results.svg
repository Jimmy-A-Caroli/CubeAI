    <rect x="1292" y="508" width="220" height="80" rx="10" data-fill-role="external-fill" data-stroke-role="external-line" fill="#F9F9F9" stroke="#B9BCC1" data-layout-parent="storage-measured"/><text x="1312" y="536" font-size="14" font-weight="700" data-fill-role="ink" fill="#252B35">SQLite</text><text x="1312" y="570" font-size="24" font-weight="700" data-fill-role="ink" fill="#252B35">120.95 MiB</text>
